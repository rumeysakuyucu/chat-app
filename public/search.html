<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesaj Arama - Live Chat</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .search-container {
            max-width: 1000px;
            margin: 50px auto;
            background: var(--bg-secondary);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid var(--border-color);
        }
        
        .search-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .search-header h2 {
            color: var(--text-primary);
            margin-bottom: 10px;
        }
        
        .search-header p {
            color: var(--text-secondary);
        }
        
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .search-box input {
            flex: 1;
            padding: 14px 20px;
            border-radius: 40px;
            border: 1px solid var(--border-color);
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 16px;
        }
        
        .search-box input:focus {
            outline: none;
            border-color: #3b82f6;
        }
        
        .search-box button {
            padding: 14px 30px;
            border-radius: 40px;
            border: none;
            background: #3b82f6;
            color: white;
            cursor: pointer;
            font-weight: 600;
        }
        
        .search-box button:hover {
            background: #2563eb;
        }
        
        .search-filters {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .search-filters select,
        .search-filters input[type="date"] {
            padding: 10px 15px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 14px;
        }
        
        .search-stats {
            color: var(--text-secondary);
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }
        
        .search-results {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 600px;
            overflow-y: auto;
        }
        
        .search-result-item {
            background: var(--bg-primary);
            border-radius: 15px;
            padding: 15px;
            border: 1px solid var(--border-color);
            transition: all 0.2s;
            cursor: pointer;
        }
        
        .search-result-item:hover {
            transform: translateX(5px);
            border-color: #3b82f6;
        }
        
        .search-result-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        
        .search-result-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
        }
        
        .search-result-user {
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .search-result-room {
            font-size: 12px;
            color: #3b82f6;
            background: rgba(59, 130, 246, 0.1);
            padding: 2px 8px;
            border-radius: 12px;
        }
        
        .search-result-date {
            font-size: 12px;
            color: var(--text-secondary);
            margin-left: auto;
        }
        
        .search-result-message {
            color: var(--text-primary);
            line-height: 1.4;
            margin-bottom: 8px;
        }
        
        .search-result-highlight {
            background: #f59e0b;
            color: #0f172a;
            padding: 0 2px;
            border-radius: 3px;
            font-weight: bold;
        }
        
        .search-result-file {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 5px;
        }
        
        .no-results {
            text-align: center;
            color: var(--text-secondary);
            padding: 40px;
        }
        
        .loading {
            text-align: center;
            color: var(--text-secondary);
            padding: 40px;
        }
        
        .back-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.2s;
        }
        
        .back-btn:hover {
            background: var(--bg-tertiary);
        }
        
        @media (max-width: 768px) {
            .search-container {
                padding: 20px;
                margin: 20px;
            }
            
            .search-box {
                flex-direction: column;
            }
            
            .search-filters {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="search-container">
        <div class="search-header">
            <h2>🔍 Mesaj Arama</h2>
            <p>Sohbet geçmişinde kelime, kullanıcı veya tarihe göre arama yapın</p>
        </div>
        
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Aranacak kelime..." autocomplete="off">
            <button id="searchBtn">🔍 Ara</button>
        </div>
        
        <div class="search-filters">
            <select id="roomFilter">
                <option value="all">Tüm Odalar</option>
                <option value="general">General</option>
                <option value="software">Software</option>
                <option value="gaming">Gaming</option>
            </select>
            <select id="userFilter">
                <option value="all">Tüm Kullanıcılar</option>
            </select>
            <input type="date" id="startDate" placeholder="Başlangıç Tarihi">
            <input type="date" id="endDate" placeholder="Bitiş Tarihi">
        </div>
        
        <div id="searchStats" class="search-stats" style="display: none;"></div>
        
        <div id="searchResults" class="search-results">
            <div class="loading">Arama yapmak için kelime girin</div>
        </div>
        
        <button class="back-btn" onclick="window.location.href='/chat'">← Sohbete Dön</button>
    </div>
    
    <script>
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = '/login.html';
        }
        
        let allMessages = [];
        
        // Tüm mesajları yükle
        async function loadMessages() {
            try {
                const res = await fetch('/api/messages?room=general');
                const messages = await res.json();
                
                // Farklı odalardan da mesajları al
                const rooms = ['general', 'software', 'gaming'];
                let allMsgs = [];
                
                for (const room of rooms) {
                    const roomRes = await fetch(`/api/messages?room=${room}`);
                    const roomMsgs = await roomRes.json();
                    allMsgs = [...allMsgs, ...roomMsgs];
                }
                
                allMessages = allMsgs.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
                
                // Kullanıcı filtreleme dropdown'ını doldur
                const users = [...new Set(allMessages.map(msg => msg.username))];
                const userFilter = document.getElementById('userFilter');
                users.forEach(user => {
                    userFilter.innerHTML += `<option value="${user}">${user}</option>`;
                });
                
            } catch (err) {
                console.error('Mesajlar yüklenemedi:', err);
            }
        }
        
        // Arama yap
        function searchMessages() {
            const searchTerm = document.getElementById('searchInput').value.trim().toLowerCase();
            const roomFilter = document.getElementById('roomFilter').value;
            const userFilter = document.getElementById('userFilter').value;
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            
            if (!searchTerm) {
                document.getElementById('searchResults').innerHTML = '<div class="loading">Arama yapmak için kelime girin</div>';
                document.getElementById('searchStats').style.display = 'none';
                return;
            }
            
            let results = [...allMessages];
            
            // Kelime ara (mesaj içinde veya dosya adında)
            results = results.filter(msg => {
                const messageMatch = msg.message?.toLowerCase().includes(searchTerm);
                const fileNameMatch = msg.fileName?.toLowerCase().includes(searchTerm);
                return messageMatch || fileNameMatch;
            });
            
            // Oda filtresi
            if (roomFilter !== 'all') {
                results = results.filter(msg => msg.room === roomFilter);
            }
            
            // Kullanıcı filtresi
            if (userFilter !== 'all') {
                results = results.filter(msg => msg.username === userFilter);
            }
            
            // Tarih filtresi
            if (startDate) {
                const start = new Date(startDate);
                start.setHours(0, 0, 0, 0);
                results = results.filter(msg => new Date(msg.createdAt) >= start);
            }
            
            if (endDate) {
                const end = new Date(endDate);
                end.setHours(23, 59, 59, 999);
                results = results.filter(msg => new Date(msg.createdAt) <= end);
            }
            
            // Sonuçları göster
            renderResults(results, searchTerm);
            
            // İstatistikleri göster
            const stats = document.getElementById('searchStats');
            stats.style.display = 'block';
            stats.innerHTML = `🔍 "${searchTerm}" için ${results.length} sonuç bulundu`;
        }
        
        // Sonuçları render et
        function renderResults(results, searchTerm) {
            const container = document.getElementById('searchResults');
            
            if (results.length === 0) {
                container.innerHTML = '<div class="no-results">Sonuç bulunamadı</div>';
                return;
            }
            
            let html = '';
            results.forEach(msg => {
                const date = new Date(msg.createdAt).toLocaleString('tr-TR', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
                
                // Mesaj içinde aranan kelimeyi vurgula
                let messageContent = msg.message || '';
                if (searchTerm && messageContent) {
                    const regex = new RegExp(`(${searchTerm})`, 'gi');
                    messageContent = messageContent.replace(regex, '<span class="search-result-highlight">$1</span>');
                }
                
                // Dosya adında aranan kelimeyi vurgula
                let fileNameContent = '';
                if (msg.fileName && msg.fileName.toLowerCase().includes(searchTerm)) {
                    const regex = new RegExp(`(${searchTerm})`, 'gi');
                    fileNameContent = msg.fileName.replace(regex, '<span class="search-result-highlight">$1</span>');
                }
                
                html += `
                    <div class="search-result-item" onclick="goToMessage('${msg._id}')">
                        <div class="search-result-header">
                            <img class="search-result-avatar" src="${msg.avatar || `https://ui-avatars.com/api/?name=${msg.username}&background=3b82f6&color=fff&bold=true`}" alt="avatar">
                            <span class="search-result-user">${msg.username}</span>
                            <span class="search-result-room">📌 ${msg.room}</span>
                            <span class="search-result-date">📅 ${date}</span>
                        </div>
                        <div class="search-result-message">${messageContent || '<span style="color: var(--text-secondary);">(Dosya paylaşıldı)</span>'}</div>
                        ${fileNameContent ? `<div class="search-result-file">📎 ${fileNameContent}</div>` : ''}
                        ${msg.fileUrl && !fileNameContent ? `<div class="search-result-file">📎 ${msg.fileName || 'Dosya'}</div>` : ''}
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        // Mesaja git
        function goToMessage(messageId) {
            window.location.href = `/chat?message=${messageId}`;
        }
        
        // Enter tuşu ile arama
        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                searchMessages();
            }
        });
        
        document.getElementById('searchBtn').addEventListener('click', searchMessages);
        
        // Filtre değişikliklerinde otomatik ara
        document.getElementById('roomFilter').addEventListener('change', searchMessages);
        document.getElementById('userFilter').addEventListener('change', searchMessages);
        document.getElementById('startDate').addEventListener('change', searchMessages);
        document.getElementById('endDate').addEventListener('change', searchMessages);
        
        // Sayfa yüklendiğinde
        loadMessages();
    </script>
</body>
</html>
